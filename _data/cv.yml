cv:
  name: Lois Orosa Nogueira
  #headline: Scientific Director, Senior Researcher
  location: Santiago de Compostela, Spain
  email: lois.orosa.nogueira@gmail.com
  #image: ""
  #summary: "I am a computer architect with a strong background in memory systems, hardware security and reliability, and data-centric computing. I am currently the Scientific Director and Senior Researcher at the Galicia Supercomputing Center (CESGA), where I lead research efforts in designing reliable, secure, and efficient computing systems for AI and other emerging applications. My research interests include computer architecture, memory systems, hardware security and reliability, data-centric computing, new memory technologies, AI hardware-software co-design, storage systems, parallel systems, and quantum computing reliability and security."
  website: https://loisorosa.github.io
  social_networks:
    - network: LinkedIn
      username: loisorosa
  
  #address:
  #  street: Avenida de Vigo, s/n
  #  city: Santiago de Compostela
  #  region: Galicia
  #  postalCode: 15705
  #  country: Spain

